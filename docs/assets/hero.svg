<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Frame Notes">
  <title>Frame Notes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b0e"/>
      <stop offset="0.55" stop-color="#14161b"/>
      <stop offset="1" stop-color="#1b1e25"/>
    </linearGradient>
    <radialGradient id="blob-hue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a63d9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3a63d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-accent" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5d8dff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5d8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d8dff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5d8dff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,system-ui,sans-serif; fill: #ffffff; }
    .name { font-size: 68px; font-weight: 700; letter-spacing: -0.02em; }
    .tag { font-size: 25px; font-weight: 400; fill-opacity: 0.78; }
    .meta { font-size: 16px; font-weight: 600; fill-opacity: 0.5; letter-spacing: 0.12em; text-transform: uppercase; }
    .b1 { animation: drift1 26s ease-in-out infinite alternate; }
    .b2 { animation: drift2 31s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0, 0); } to { transform: translate(90px, -40px); } }
    @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-110px, 50px); } }
    @media (prefers-reduced-motion: reduce) { .b1, .b2 { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="b1" cx="922" cy="72" r="312" fill="url(#blob-hue)"/>
      <circle class="b2" cx="384" cy="380" r="248" fill="url(#blob-accent)"/>
    </g>
    <rect x="112.0" y="120.0" width="160" height="160" rx="32" fill="url(#tile)" stroke="url(#rim)" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="142.4" y="150.4" width="99.2" height="99.2" viewBox="0 0 64 64" preserveAspectRatio="xMidYMid meet">
  <rect x="4" y="10" width="56" height="44" rx="8" fill="#1a1c20" stroke="#4a4f59" stroke-width="2"/>
  <rect x="14" y="20" width="22" height="16" rx="1" fill="none" stroke="#EF9F27" stroke-width="3"/>
  <rect x="12" y="44" width="4" height="6" rx="1" fill="#EF9F27"/>
  <rect x="30" y="44" width="4" height="6" rx="1" fill="#639922"/>
  <rect x="46" y="44" width="4" height="6" rx="1" fill="#E24B4A"/>
</svg>
    <text class="t name" x="320.0" y="190.0">Frame Notes</text>
    <rect x="320.0" y="204.0" width="200" height="3" rx="1.5" fill="url(#line)"/>
    <text class="t tag" x="320.0" y="241.0">Frame-accurate review notes for video editors</text>
    <text class="t meta" x="320.0" y="279.0">Windows 10 / 11 · Portable · Open source</text>
  </g>
</svg>
